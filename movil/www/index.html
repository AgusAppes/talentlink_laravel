<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>TalentLink</title>
    <style>
        body { margin: 0; font-family: "Segoe UI", system-ui, sans-serif; background: #f4f6fb; color: #0f172a; }
        h1, h2, p { margin: 0; }
        button { font: inherit; cursor: pointer; }
        #login, #registro { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1.5rem; box-sizing: border-box; }
        #login[hidden], #registro[hidden] { display: none; }
        .enlace { display: block; width: 100%; margin-top: 0.35rem; padding: 0.6rem; border: 0; background: transparent; color: #1f3c88; font-weight: 600; }
        .login-caja { width: 100%; max-width: 24rem; }
        .logo { display: block; width: 8.5rem; height: auto; margin: 0 auto 1.25rem; border-radius: 0.75rem; }
        .panel { background: #fff; border-radius: 1rem; box-shadow: 0 8px 24px rgba(15, 23, 42, 0.08); padding: 1.5rem; }
        .panel h1 { font-size: 1.35rem; color: #0b1b3a; }
        .panel > p { margin-top: 0.35rem; color: #64748b; }
        label { display: block; margin: 1rem 0 0.4rem; color: #334155; font-size: 0.95rem; }
        input { width: 100%; box-sizing: border-box; min-height: 3rem; padding: 0.75rem 0.9rem; border: 1px solid #e5e7eb; border-radius: 0.75rem; font-size: 1rem; }
        .entrar { width: 100%; margin-top: 1.25rem; min-height: 3rem; border: 0; border-radius: 0.75rem; background: #1f3c88; color: #fff; font-weight: 600; }
        .error { min-height: 1.25rem; margin-top: 0.75rem; color: #b91c1c; }
        #feed { padding-bottom: 5rem; }
        #feed[hidden] { display: none; }
        .vista[hidden] { display: none; }
        .menu { position: fixed; left: 0; right: 0; bottom: 0; display: flex; gap: 0.35rem; padding: 0.5rem 0.75rem calc(0.5rem + env(safe-area-inset-bottom)); background: #fff; border-top: 1px solid #e5e7eb; }
        .menu button { flex: 1; margin: 0; min-height: 2.75rem; border: 0; border-radius: 0.75rem; background: transparent; color: #64748b; font-weight: 600; }
        .menu button.activo { background: #eef2ff; color: #1f3c88; }
        .barra { position: sticky; top: 0; display: flex; align-items: center; justify-content: space-between; gap: 1rem; padding: 0.9rem 1rem; background: #0b1b3a; color: #fff; }
        .marca { font-size: 0.75rem; letter-spacing: 0.04em; text-transform: uppercase; color: #93c5fd; }
        .barra h1 { margin-top: 0.15rem; font-size: 1.15rem; }
        #salir { margin: 0; padding: 0.45rem 0.9rem; border: 0; border-radius: 999px; background: #fff; color: #1f3c88; font-weight: 600; }
        .contenido { max-width: 32rem; margin: 0 auto; padding: 1rem; }
        .aviso { margin-bottom: 0.75rem; color: #1f3c88; }
        .aviso:empty { display: none; }
        article { margin-top: 0.85rem; padding: 1rem; background: #fff; border-radius: 1rem; box-shadow: 0 4px 16px rgba(15, 23, 42, 0.06); }
        .empresa { color: #1f3c88; font-size: 0.85rem; font-weight: 700; }
        article h2 { margin-top: 0.2rem; font-size: 1.15rem; color: #0b1b3a; }
        .meta { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-top: 0.7rem; }
        .meta span { padding: 0.2rem 0.55rem; border-radius: 999px; background: #eef2ff; color: #1e3a8a; font-size: 0.78rem; }
        .descripcion { margin-top: 0.7rem; color: #475569; font-size: 0.92rem; line-height: 1.4; }
        .estado { margin-top: 0.85rem; color: #15803d; font-weight: 600; }
        .nota { margin-top: 0.85rem; color: #64748b; }
        article button { width: 100%; margin-top: 0.9rem; min-height: 2.75rem; border: 0; border-radius: 0.75rem; background: #1f3c88; color: #fff; font-weight: 600; }
        article button.cancelar { background: #fff; color: #b91c1c; border: 1px solid #fecaca; }
        .vacio { color: #64748b; }
        #cargando { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(244, 246, 251, 0.92); }
        #cargando[hidden] { display: none; }
        #cargando p { color: #1f3c88; font-weight: 700; }
    </style>
</head>
<body>
    <section id="login">
        <div class="login-caja">
            <img class="logo" src="logo.jpg" alt="TalentLink">
            <div class="panel">
                <h1>Iniciar sesión</h1>
                <p>Entrá con tu cuenta de candidato.</p>
                <form id="form-login">
                    <label for="correo">Correo</label>
                    <input id="correo" type="email" autocomplete="username" required>
                    <label for="password">Contraseña</label>
                    <input id="password" type="password" autocomplete="current-password" required>
                    <button class="entrar" type="submit">Iniciar sesión</button>
                </form>
                <p id="login-aviso" class="error"></p>
                <button id="ir-registro" class="enlace" type="button">¿No tenés cuenta? Registrate</button>
            </div>
        </div>
    </section>

    <section id="registro" hidden>
        <div class="login-caja">
            <img class="logo" src="logo.jpg" alt="TalentLink">
            <div class="panel">
                <h1>Crear cuenta</h1>
                <p>Registrate como candidato.</p>
                <form id="form-registro">
                    <label for="nombre">Nombre</label>
                    <input id="nombre" type="text" maxlength="45" required>
                    <label for="apellido">Apellido</label>
                    <input id="apellido" type="text" maxlength="45" required>
                    <label for="correo-registro">Correo</label>
                    <input id="correo-registro" type="email" autocomplete="username" required>
                    <label for="password-registro">Contraseña</label>
                    <input id="password-registro" type="password" autocomplete="new-password" minlength="6" required>
                    <label for="password-confirmacion">Repetir contraseña</label>
                    <input id="password-confirmacion" type="password" autocomplete="new-password" minlength="6" required>
                    <button class="entrar" type="submit">Crear cuenta</button>
                </form>
                <p id="registro-aviso" class="error"></p>
                <button id="ir-login" class="enlace" type="button">Ya tengo cuenta</button>
            </div>
        </div>
    </section>

    <section id="feed" hidden>
        <header class="barra">
            <div>
                <p class="marca">TalentLink</p>
                <h1 id="saludo">Ofertas</h1>
            </div>
            <button id="salir" type="button">Salir</button>
        </header>
        <div id="vista-ofertas" class="contenido vista">
            <p id="feed-aviso" class="aviso"></p>
            <div id="ofertas"></div>
        </div>
        <div id="vista-postulaciones" class="contenido vista" hidden>
            <p id="postulaciones-aviso" class="aviso"></p>
            <div id="pendientes"></div>
        </div>
        <nav class="menu">
            <button id="ir-ofertas" class="activo" type="button">Ofertas</button>
            <button id="ir-postulaciones" type="button">Postulaciones</button>
        </nav>
    </section>

    <div id="cargando" hidden>
        <p>Cargando...</p>
    </div>
    <script src="app.js"></script>
</body>
</html>
